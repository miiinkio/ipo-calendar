name: DART 동기화

# 평일 06~20시 매시간 자동 실행. 끄려면 schedule 부분을 주석 처리하세요.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "미리보기만 (데이터 안 바꿈)"
        type: boolean
        default: true
  # 스크립트를 고치면 미리보기로만 한 번 돌려 봅니다 (데이터는 절대 안 바꿈)
  push:
    branches: [main]
    paths: ["scripts/dart_sync.py", ".github/workflows/dart-sync.yml", ".github/run-now"]
  # .github/run-now 파일을 고쳐 올리면 그 자리에서 실제 동기화를 한 번 돌립니다
  # GitHub가 예약 실행을 가끔 건너뛰어서 매시 17분·47분 두 번 걸어 둠 (겹치면 순서대로 실행)
  schedule:                       # 평일 06~20시(KST)
    - cron: "17,47 21-23 * * 0-4" # 06~08시 (전날 UTC 21~23시)
    - cron: "17,47 0-11 * * 1-5"  # 09~20시

permissions:
  contents: write

concurrency:
  group: dart-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # 항상 최신 main에서 시작 (다른 실행과 충돌 방지)
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: OpenDART에서 가져오기
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          DRY_RUN: ${{ (github.event_name == 'push' && !contains(github.event.head_commit.message, '[run-now]')) || (github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        run: python3 scripts/dart_sync.py
      - name: 바뀐 내용 커밋
        if: ${{ (github.event_name == 'schedule') || (github.event_name == 'push' && contains(github.event.head_commit.message, '[run-now]')) || (github.event_name == 'workflow_dispatch' && !inputs.dry_run) }}
        run: |
          if git diff --quiet -- data/ && [ -z "$(git status --porcelain data/)" ]; then echo "변경 없음"; exit 0; fi
          git config user.name "dart-sync-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ipo.json data/meta.json data/dart_audit.json
          git commit -m "DART 자동 동기화 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M')"
          for i in 1 2 3; do
            git pull --rebase -X theirs -q origin main && git push && exit 0
            git rebase --abort 2>/dev/null || true
            sleep 5
          done
          exit 1
