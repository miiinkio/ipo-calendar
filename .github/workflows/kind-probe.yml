name: KIND 시험

on:
  push:
    branches: [main]
    paths: ["scripts/kind_probe.py"]

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 scripts/kind_probe.py
